<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }
        .navbar {
            background: #333;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card h3 {
            color: #666;
            margin-bottom: 10px;
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }
        .content-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f4f4f4;
        }
        .status {
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
        }
        .status.active {
            background: #2ecc71;
            color: white;
        }
        .status.inactive {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Admin Dashboard</h2>
        <div>
            <span id="adminName" style="margin-right: 15px;"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Orders</h3>
                <div class="number" id="activeOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>Revenue</h3>
                <div class="number" id="revenue">$0</div>
            </div>
        </div>

        <div class="content-card">
            <h2>Recent Users</h2>
            <table id="usersTable">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Check authentication
        function checkAuth() {
            const isLoggedIn = localStorage.getItem('isAdminLoggedIn');
            if (isLoggedIn !== 'true') {
                window.location.href = 'admin-login.html';
            }
        }

        // Display admin name
        function displayAdminInfo() {
            const username = localStorage.getItem('adminUsername');
            document.getElementById('adminName').textContent = `Welcome, ${username}`;
        }

        // Load dashboard data (example data)
        function loadDashboardData() {
            // Example statistics
            document.getElementById('totalUsers').textContent = '1,234';
            document.getElementById('activeOrders').textContent = '56';
            document.getElementById('revenue').textContent = '$12,345';

            // Example users data
            const users = [
                { id: 1, name: 'John Doe', email: 'john@example.com', status: 'active' },
                { id: 2, name: 'Jane Smith', email: 'jane@example.com', status: 'active' },
                { id: 3, name: 'Bob Johnson', email: 'bob@example.com', status: 'inactive' },
            ];

            const tbody = document.querySelector('#usersTable tbody');
            tbody.innerHTML = '';
            users.forEach(user => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = user.id;
                row.insertCell(1).textContent = user.name;
                row.insertCell(2).textContent = user.email;
                row.insertCell(3).innerHTML = `<span class="status ${user.status}">${user.status}</span>`;
            });
        }

        // Logout function
        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            localStorage.removeItem('adminUsername');
            window.location.href = 'admin-login.html';
        }

        // Initialize dashboard
        checkAuth();
        displayAdminInfo();
        loadDashboardData();
    </script>
</body>
</html>
