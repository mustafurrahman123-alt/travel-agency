    <script>
        // --- CONFIGURATION ---
        // If you created config.js, use that. Otherwise, define it here.
        const API_BASE_URL = 'https://ravel-agency-backend.onrender.com/api';

        // --- AUTHENTICATION ---
        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                window.location.href = 'admin-login.html';
            }
        }

        function displayAdminInfo() {
            const username = localStorage.getItem('adminUsername');
            document.getElementById('adminName').textContent = `Welcome, ${username}`;
        }

        // --- LOAD REAL DATA FROM BACKEND ---
        async function loadDashboardData() {
            const token = localStorage.getItem('adminToken');

            try {
                // 1. Fetch Dashboard Stats (Total Users, Orders, Revenue)
                const statsResponse = await fetch(`${API_BASE_URL}/admin/stats`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!statsResponse.ok) {
                    throw new Error('Failed to fetch stats');
                }

                const stats = await statsResponse.json();
                // Assuming your backend returns: { totalUsers: 1234, activeOrders: 56, revenue: 12345 }
                document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
                document.getElementById('activeOrders').textContent = stats.activeOrders || 0;
                document.getElementById('revenue').textContent = `$${stats.revenue || 0}`;

                // 2. Fetch Recent Users List
                const usersResponse = await fetch(`${API_BASE_URL}/admin/users`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!usersResponse.ok) {
                    throw new Error('Failed to fetch users');
                }

                const users = await usersResponse.json();
                const tbody = document.querySelector('#usersTable tbody');
                tbody.innerHTML = '';

                // Loop through real users from database
                users.forEach(user => {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = user.id;
                    row.insertCell(1).textContent = user.name;
                    row.insertCell(2).textContent = user.email;
                    const statusClass = user.status === 'active' ? 'active' : 'inactive';
                    row.insertCell(3).innerHTML = `<span class="status ${statusClass}">${user.status}</span>`;
                });

            } catch (error) {
                console.error('Error loading dashboard:', error);
                alert('Failed to load dashboard data. Please check your connection.');
            }
        }

        // --- LOGOUT ---
        async function logout() {
            const token = localStorage.getItem('adminToken');
            if (token) {
                try {
                    // Optional: Tell backend to invalidate token
                    await fetch(`${API_BASE_URL}/admin/logout`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (e) {
                    console.log('Logout error:', e);
                }
            }
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUsername');
            window.location.href = 'admin-login.html';
        }

        // --- INIT ---
        checkAuth();
        displayAdminInfo();
        loadDashboardData();
    </script>
