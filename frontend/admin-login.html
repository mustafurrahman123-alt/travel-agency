<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 400px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        
        .success {
            color: green;
            text-align: center;
            margin-top: 10px;
        }
        
        .info {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>✈️ TravelEase Admin</h1>
        <div class="subtitle">Sign in to manage your travel packages</div>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>
        <div id="loadingMsg" class="loading">Authenticating...</div>
        
        <div class="info">
            <strong>🔐 Admin Access</strong><br>
            Use the credentials you created in your Supabase `admins` table
        </div>
    </div>
    
    <script>
        // Use your LIVE Render backend URL
        const API_URL = 'https://ravel-agency-backend.onrender.com/api';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const loadingMsg = document.getElementById('loadingMsg');
            
            // Clear previous messages
            errorMsg.textContent = '';
            successMsg.textContent = '';
            loadingMsg.style.display = 'block';
            
            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Save token to localStorage
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminEmail', email);
                    successMsg.textContent = 'Login successful! Redirecting...';
                    
                    // Redirect to dashboard after short delay
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    errorMsg.textContent = data.error || 'Login failed. Please check your credentials.';
                }
            } catch (error) {
                errorMsg.textContent = 'Server error. Please make sure the backend is running.';
                console.error('Login error:', error);
            } finally {
                loadingMsg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
