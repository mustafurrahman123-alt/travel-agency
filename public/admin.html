<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color:red; margin-top:10px;"></p>
    </div>
    <script>
        function login() {
            if(username.value === "admin" && password.value === "admin123") {
                localStorage.setItem("adminLoggedIn", "true");
                window.location.href = "dashboard.html";
            } else {
                error.innerHTML = "Invalid! Use admin/admin123";
            }
        }
    </script>
</body>
</html>
