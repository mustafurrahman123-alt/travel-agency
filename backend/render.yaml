services:
  - type: web
    name: travel-agency-backend
    runtime: node
    repo: https://github.com/YOUR_USERNAME/travel-agency-backend
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
    buildCommand: npm install
    startCommand: node server.js
